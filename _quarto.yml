project:
  type: website
  output-dir: docs
  post-render:
    - python create_nojekyll.py

website:
  title: "Health Domains & ML: A Skill-Building Course"
  description: "Seventeen self-paced lessons pairing health domains with statistical and machine-learning models."
  navbar:
    background: primary
    left:
      - href: index.qmd
        text: Home
      - href: about.qmd
        text: About
      - text: Lessons
        menu:
          - href: lessons/01-linear-regression.qmd
            text: "1. Birth Weight - Linear Regression"
          - href: lessons/02-train-test-split.qmd
            text: "2. Train/Test Splitting & Honest Evaluation"
          - href: lessons/03-cardiovascular-logistic.qmd
            text: "3. Cardiovascular Disease - Logistic Regression"
          - href: lessons/04-diabetes-random-forest.qmd
            text: "4. Diabetes - Random Forest"
          - href: lessons/05-breast-cancer-svm.qmd
            text: "5. Breast Cancer - Support Vector Machines"
          - href: lessons/06-readmission-xgboost.qmd
            text: "6. Hospital Readmission - Gradient Boosting (XGBoost)"
          - href: lessons/07-mental-health-naive-bayes.qmd
            text: "7. Mental Health Text - Naive Bayes / NLP"
          - href: lessons/08-covid-timeseries.qmd
            text: "8. COVID-19 - Time-Series Forecasting"
          - href: lessons/09-genomics-clustering.qmd
            text: "9. Genomics - PCA & Clustering"
          - href: lessons/10-medical-imaging-cnn.qmd
            text: "10. Medical Imaging - Convolutional Neural Networks"
          - href: lessons/11-survival-cox.qmd
            text: "11. Cancer Survival - Cox Proportional Hazards"
          - href: lessons/12-drug-discovery-rf.qmd
            text: "12. Drug Discovery - Random Forest on Molecules"
          - href: lessons/13-causal-inference-nhanes.qmd
            text: "13. Causal Inference - Propensity Scores (NHANES)"
          - href: lessons/14-healthcare-costs-glm.qmd
            text: "14. Healthcare Costs - Generalized Linear Models"
          - href: lessons/15-obesity-ordinal.qmd
            text: "15. Obesity - Ordinal / Multinomial Regression"
          - href: lessons/16-ehr-nlp-transformers.qmd
            text: "16. Clinical Notes - Transformers / BERT"
          - href: lessons/17-anomaly-detection.qmd
            text: "17. Anomaly Detection - Isolation Forest"
  page-footer: "Built with Quarto. Content for educational use."

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    code-fold: show
    code-tools: true
    number-sections: false
