          - href: lessons/03-train-test-split.qmd
            text: "3. Train/Test Splitting & Honest Evaluation"
          - href: lessons/04-healthcare-costs-glm.qmd
            text: "4. Healthcare Costs - Generalized Linear Models"
          - href: lessons/05-obesity-ordinal.qmd
            text: "5. Obesity - Ordinal / Multinomial Regression"
          - href: lessons/06-diabetes-random-forest.qmd
            text: "6. Diabetes - Random Forest"
          - href: lessons/07-readmission-xgboost.qmd
            text: "7. Hospital Readmission - Gradient Boosting (XGBoost)"
          - href: lessons/08-breast-cancer-svm.qmd
            text: "8. Breast Cancer - Support Vector Machines"
          - href: lessons/09-mental-health-naive-bayes.qmd
